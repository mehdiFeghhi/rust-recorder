name: Release

# Tags only: `v0.1.0`, `v1.2.3`, ... No release is published during Phase 0.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege at the workflow level; the job needs write access to create
# the GitHub Release with the automatic GITHUB_TOKEN. No custom secrets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustc --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # A tag is a promise about a version: fail instead of publishing a
      # binary whose version disagrees with the release name.
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${version}."
            exit 1
          fi
          echo "Releasing rust-recorder ${version}"

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary and documentation
        run: |
          set -euo pipefail
          name="rust-recorder-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          cp target/release/rust-recorder "dist/${name}/"
          for doc in README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$doc" ]; then
              cp "$doc" "dist/${name}/"
            fi
          done
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          # Record the bare filename so users can verify from the download
          # directory with `sha256sum -c <file>.sha256`.
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          # Keep only the two publishable files; the staging directory would
          # otherwise match dist/* and be uploaded as an artifact too.
          rm -rf "dist/${name}"
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
